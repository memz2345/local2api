name: Windows

on:
  workflow_dispatch:
  push:
    branches: [main, 'ci/**']
    paths-ignore:
      - '**.md'
      - '.workbuddy/**'

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          architecture: x64
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Toolchain info
        run: |
          flutter --version
          flutter doctor -v
          node --version
          npm --version

      - name: Install Dart dependencies
        run: flutter pub get

      # `native/bundle` 是 gitignore 的本地产物；Windows 的 llamadart hook
      # 要求 windows-x64 目录真实存在。上游 release 里带 CUDA（735MB），
      # 这里只解出 CPU/Vulkan 那 11 个 DLL（与开发机 bundle 一致）。
      - name: Fetch Windows native bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/leehack/llamadart-native/releases/download/v0.4.0/llamadart-native-windows-x64-v0.4.0.tar.gz'
          $archive = Join-Path $env:RUNNER_TEMP 'llamadart-windows-x64-v0.4.0.tar.gz'
          if (-not (Test-Path $archive)) {
            Invoke-WebRequest -Uri $url -OutFile $archive -TimeoutSec 600
          }
          $dest = 'native/bundle/windows-x64'
          New-Item -ItemType Directory -Force $dest | Out-Null
          $files = @(
            './ggml-base.dll', './ggml-blas.dll', './ggml-cpu.dll',
            './ggml-vulkan.dll', './ggml.dll', './llama-common.dll',
            './llama.dll', './llamadart.dll', './mtmd.dll',
            './openblas.dll', './vcomp140.dll'
          )
          tar -xzf $archive -C $dest @files
          Get-ChildItem $dest | Select-Object Name,Length

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # 预先装好 DSH：集成测试只验证「应用能把它拉起来 + 插件能装上」，
      # 不重复测 npm 下载。CI 里用最新版（0.2.x），插件的插槽才齐全。
      - name: Install DeepSeek Harness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'dsh-app'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Set-Location $dir
          [System.IO.File]::WriteAllText(
            (Join-Path $dir 'package.json'),
            '{"name":"local2api-dsh-ci","private":true}' + "`n",
            (New-Object System.Text.UTF8Encoding($false))
          )
          npm install @deepseek-ai/dsh --omit=dev --no-audit --no-fund --loglevel=error
          if (-not (Test-Path (Join-Path $dir 'node_modules/@deepseek-ai/dsh/lib/bin.js'))) {
            throw 'DSH install did not produce lib/bin.js'
          }

      - name: Run unit tests
        run: flutter test --reporter compact

      - name: Build Windows app (release)
        run: flutter build windows --release

      - name: Run DSH smoke test (plugins + toast + WebView2)
        shell: pwsh
        env:
          L2A_DSH_DIR: ${{ runner.temp }}/dsh-app
          L2A_SHOT_DIR: ${{ github.workspace }}/build/windows_shots
          DSH_HOME: ${{ runner.temp }}/dsh-home
          DSH_AGENTS_HOME: ${{ runner.temp }}/dsh-agents
        run: |
          New-Item -ItemType Directory -Force $env:L2A_SHOT_DIR, $env:DSH_HOME, $env:DSH_AGENTS_HOME | Out-Null
          $log = Join-Path $env:L2A_SHOT_DIR 'windows-dsh-smoke.log'
          flutter test integration_test/windows_dsh_smoke_test.dart -d windows --reporter expanded 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          Get-Content $log -Tail 250
          if ($code -ne 0) { exit $code }

      # 内置浏览器输入回归：滚轮命中测试、右键原生菜单开关、IME 锚点窗口位置、
      # 点击焦点。不依赖外网/DSH，失败不阻塞后面的 live 实测。
      - name: Run browser input regression (Windows, best effort)
        continue-on-error: true
        shell: pwsh
        env:
          L2A_SHOT_DIR: ${{ github.workspace }}/build/windows_shots
        run: |
          New-Item -ItemType Directory -Force $env:L2A_SHOT_DIR | Out-Null
          $log = Join-Path $env:L2A_SHOT_DIR 'windows-browser-input.log'
          flutter test integration_test/windows_browser_input_test.dart -d windows --reporter expanded 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          Get-Content $log -Tail 200
          if ($code -ne 0) { exit $code }

      # 真网实测：miuix + Zen 免费车道 minimax 识别 Windows 系统信息，
      # 同时覆盖 pwsh→bash 改名还原。通知链路由离线假上游 smoke 测试。
      # 会请求 opencode.ai，可能受出口地区/额度影响，所以不阻塞发版。
      - name: Live Zen minimax system-info test (Windows, best effort)
        continue-on-error: true
        shell: pwsh
        env:
          L2A_DSH_DIR: ${{ runner.temp }}/dsh-app
          L2A_SHOT_DIR: ${{ github.workspace }}/build/windows_shots
          # 独立 home：上一轮假上游测试会留下会话与插件安装记录。
          DSH_HOME: ${{ runner.temp }}/dsh-home-live
          DSH_AGENTS_HOME: ${{ runner.temp }}/dsh-agents-live
        run: |
          New-Item -ItemType Directory -Force $env:L2A_SHOT_DIR, $env:DSH_HOME, $env:DSH_AGENTS_HOME | Out-Null
          $log = Join-Path $env:L2A_SHOT_DIR 'windows-zen-minimax.log'
          flutter test integration_test/windows_zen_minimax_test.dart -d windows --reporter expanded 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          Get-Content $log -Tail 250
          if ($code -ne 0) { exit $code }

      # 电脑操作模式实测：装 dsh-computer-use-mode（缺的原生依赖 koffi 由应用
      # 自己补装），让免费视觉车道用 computer 工具真的去操作一个 GUI 应用
      # （记事本：启动 → 聚焦 → 打字 → 截图 → 把截图里的字复述回来）。
      # 会请求 opencode.ai + 真动鼠标键盘，不阻塞发版。
      - name: Live computer-use GUI test (Windows, best effort)
        continue-on-error: true
        shell: pwsh
        env:
          L2A_DSH_DIR: ${{ runner.temp }}/dsh-app
          L2A_SHOT_DIR: ${{ github.workspace }}/build/windows_shots
          # 独立 home：插件安装与预设缓存互不干扰。
          DSH_HOME: ${{ runner.temp }}/dsh-home-cu
          DSH_AGENTS_HOME: ${{ runner.temp }}/dsh-agents-cu
        run: |
          New-Item -ItemType Directory -Force $env:L2A_SHOT_DIR, $env:DSH_HOME, $env:DSH_AGENTS_HOME | Out-Null
          $log = Join-Path $env:L2A_SHOT_DIR 'windows-computer-use.log'
          flutter test integration_test/windows_computer_use_test.dart -d windows --reporter expanded 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          Get-Content $log -Tail 250
          if ($code -ne 0) { exit $code }

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-dsh-screenshots
          path: build/windows_shots/**
          if-no-files-found: warn

      - name: Package Windows app
        if: always()
        shell: pwsh
        run: |
          $src = 'build/windows/x64/runner/Release'
          if (-not (Test-Path $src)) {
            Write-Host 'No release app (the build failed); skipping package step.'
            exit 0
          }
          Compress-Archive -Path (Join-Path $src '*') `
            -DestinationPath (Join-Path $env:RUNNER_TEMP 'Local2API-windows-x64.zip') `
            -Force

      - name: Upload Windows app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Local2API-windows-x64
          path: ${{ runner.temp }}/Local2API-windows-x64.zip
          if-no-files-found: warn
